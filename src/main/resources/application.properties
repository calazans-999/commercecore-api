spring.application.name=commercecore-api

server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/commercecore
spring.datasource.username=commercecore
spring.datasource.password=${COMMERCECORE_DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info

commercecore.jwt.secret=${COMMERCECORE_JWT_SECRET}
